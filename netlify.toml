# Netlify build settings for the KidsBrain frontend (Vite React app).
# Connect this repo to Netlify, and pick "Deploy site" — Netlify picks
# this file up automatically. No manual build settings needed.

[build]
  base    = "client"
  command = "npm install && npm run build"
  # publish is resolved RELATIVE to base — so this becomes client/dist
  # (Vite's default output dir). Prefixing with "client/" would break
  # into client/client/dist which doesn't exist.
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — every non-file path renders index.html so client-side
# routing (/enter, /play, /parent, /admin/*) works on hard refresh.
# The service worker also uses this via navigateFallback.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# Proxy API calls to the Render backend. Netlify rewrites keep the
# frontend and API on the same origin from the browser's perspective,
# which sidesteps CORS entirely + lets the sandboxed /game-host iframe
# talk to /api without a preflight.
#
# Set BACKEND_ORIGIN as a Netlify build env var (e.g. https://kidsbrain-api.onrender.com).
[[redirects]]
  from = "/api/*"
  to   = "https://kidsbrain-api.onrender.com/api/:splat"
  status = 200
  force = true

# Cache the generated icons + manifest aggressively. index.html and the
# JS entry are hashed, so the app-shell caching is safe.
[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
